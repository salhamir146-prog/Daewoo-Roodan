<!DOCTYPE html>
<html lang="fa" dir="rtl" class="scroll-smooth">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>فروشگاه لوازم خانگی دوو رودان</title>
  <meta name="description" content="فروشگاه رسمی لوازم خانگی دوو در رودان. خرید آنلاین انواع یخچال، لباسشویی و تلویزیون دوو با بهترین قیمت.">
  <meta name="keywords" content="لوازم خانگی, دوو رودان, لوازم خانگی دوو, یخچال دوو">

  <!-- Schema.org برای سئو گوگل -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@type": "HomeGoodsStore",
    "name": "فروشگاه دوو رودان",
    "telephone": "09981064505",
    "address": { "@type": "PostalAddress", "addressLocality": "رودان", "addressRegion": "هرمزگان" }
  }
  </script>

  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css">
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="stylesheet" href="/assets/css/style.css">
</head>
<body class="bg-[#f2f5f8] text-gray-800 font-['Vazirmatn'] pb-20 antialiased selection:bg-blue-500 selection:text-white">

  <!-- هدر همرنگ اپلیکیشن ترب/دیجی‌کالا + نوار سرچ -->
  <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md px-4 py-3 shadow-sm border-b border-gray-100">
    <div class="max-w-md mx-auto">
      <!-- نوار جستجوی اختصاصی -->
      <div class="relative flex items-center bg-gray-100 rounded-2xl px-3 py-2.5 border border-gray-200/60 focus-within:border-blue-500 transition">
        <i data-lucide="search" class="w-5 h-5 text-gray-500 ml-2"></i>
        <input type="text" id="search-input" placeholder="نام کالا یا فروشگاه..." class="w-full bg-transparent text-sm text-gray-800 placeholder-gray-400 focus:outline-none">
        <div class="flex items-center gap-2 mr-2 text-gray-400">
          <button class="hover:text-blue-600 transition"><i data-lucide="mic" class="w-4 h-4"></i></button>
          <button class="hover:text-blue-600 transition"><i data-lucide="camera" class="w-4 h-4"></i></button>
        </div>
      </div>
    </div>
  </header>

  <main class="max-w-md mx-auto px-3 pt-4">
    
    <!-- تیتر بخش -->
    <div class="flex items-center justify-between mb-3 px-1">
      <h1 class="text-base font-bold text-gray-900">تخفیف‌های ویژه لوازم خانگی دوو</h1>
      <a href="/products.html" class="text-xs font-semibold text-blue-600 hover:text-blue-700">نمایش همه</a>
    </div>

    <!-- گرید ۲ ستونه کاملاً دقیق مشابه اسکرین‌شات -->
    <div id="products-grid" class="grid grid-cols-2 gap-3">
      <!-- آیتم‌های پیش‌فرض قبل از لود شدن از KV -->
      <div class="bg-white rounded-2xl p-2.5 border border-gray-100 shadow-sm animate-pulse h-64"></div>
      <div class="bg-white rounded-2xl p-2.5 border border-gray-100 shadow-sm animate-pulse h-64"></div>
    </div>

  </main>

  <!-- نوار دسترسی پایین صفحه (Bottom Navigation) -->
  <nav class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 py-2 px-4 z-50 shadow-lg">
    <div class="max-w-md mx-auto flex justify-between items-center text-center text-xs text-gray-500">
      
      <a href="/" class="flex flex-col items-center text-blue-600 font-bold gap-1">
        <i data-lucide="search" class="w-5 h-5"></i>
        <span>جستجو</span>
      </a>

      <a href="/products.html" class="flex flex-col items-center hover:text-blue-600 transition gap-1">
        <i data-lucide="layout-grid" class="w-5 h-5"></i>
        <span>دسته‌بندی</span>
      </a>

      <a href="/cart.html" class="flex flex-col items-center hover:text-blue-600 transition gap-1 relative">
        <i data-lucide="shopping-bag" class="w-5 h-5"></i>
        <span>سبد خرید</span>
        <span id="cart-badge" class="absolute -top-1 right-2 bg-red-500 text-white text-[10px] w-4 h-4 rounded-full flex items-center justify-center hidden">0</span>
      </a>

      <a href="/admin.html" class="flex flex-col items-center hover:text-blue-600 transition gap-1">
        <i data-lucide="user" class="w-5 h-5"></i>
        <span>حساب من</span>
      </a>

    </div>
  </nav>

  <script src="/assets/js/app.js"></script>
</body>
</html>
